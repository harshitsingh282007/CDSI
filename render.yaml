services:
  - type: web
    name: cdsi-api-server
    env: node
    buildCommand: npx pnpm@10.34.5 install --no-frozen-lockfile && npx pnpm@10.34.5 --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.5-flash
